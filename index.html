<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOFTDUMP</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* ===== GLOBAL ===== */
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Space Grotesk',sans-serif;background:#050714;color:white;overflow-x:hidden;}
h1,h2,h3,h4,h5,h6{margin:0;padding:0;}

/* ===== LOADER ===== */
#loader{position:fixed;inset:0;background:#050714;display:flex;justify-content:center;align-items:center;z-index:99999;}
.loader-box{text-align:center;width:320px;}
.loader-box h2{font-family:'Orbitron';color:#8b5cf6;margin-bottom:20px;}
.bar{width:100%;height:10px;background:#11162a;border-radius:20px;overflow:hidden;border:1px solid rgba(139,92,246,0.2);}
.progress{height:100%;width:0%;background:linear-gradient(135deg,#8b5cf6,#3b82f6);transition:0.2s;}
.text{margin-top:15px;color:#9aa4c7;font-size:14px;}
.percent{margin-top:8px;font-family:'Orbitron';color:white;}

/* ===== LOGIN ===== */
#loginPage{height:100vh;display:flex;justify-content:center;align-items:center;}
.box{width:400px;padding:40px;border-radius:18px;background:rgba(15,19,42,0.6);backdrop-filter:blur(18px);border:1px solid rgba(139,92,246,0.25);text-align:center;animation:fadeUp 0.8s ease;}
h1{font-family:'Orbitron';color:#8b5cf6;animation:glow 3s infinite;}
input{width:100%;padding:14px;margin-top:15px;border:none;border-radius:12px;background:rgba(7,10,26,0.8);color:white;}
button{width:100%;padding:14px;margin-top:15px;border:none;border-radius:12px;cursor:pointer;font-weight:bold;color:white;background:linear-gradient(135deg,#8b5cf6,#3b82f6);}
#error{color:#ff4d4d;margin-top:10px;display:none;}
#success{color:#00ff99;margin-top:10px;display:none;}

/* ===== MAIN ===== */
#mainSite{display:none;}
nav{position:fixed;top:0;width:100%;padding:18px 10%;display:flex;justify-content:space-between;align-items:center;background:rgba(5,7,20,0.6);backdrop-filter:blur(20px);border-bottom:1px solid rgba(139,92,246,0.15);z-index:999;}
.logo{font-family:'Orbitron';font-size:22px;animation:glow 4s infinite;}
.logo span{color:#8b5cf6;}
.nav-links a{color:white;margin-left:20px;text-decoration:none;opacity:0.7;transition:0.3s;}
.nav-links a:hover{opacity:1;color:#8b5cf6;}
.hero{min-height:100vh;display:flex;justify-content:space-between;align-items:center;padding:140px 10% 80px;}
.hero-left{animation:fadeUp 1s ease;}
.badge{display:inline-block;padding:8px 16px;border-radius:50px;border:1px solid #8b5cf6;color:#8b5cf6;animation:float 4s infinite;}
.hero h1{font-family:'Orbitron';font-size:4rem;}
.hero h1 span{color:#8b5cf6;}
.buttons{margin-top:25px;}
.btn{display:inline-block;padding:14px 26px;border-radius:12px;text-decoration:none;font-weight:600;transition:0.3s;}
.btn-primary{background:linear-gradient(135deg,#8b5cf6,#3b82f6);}
.btn-secondary{border:1px solid rgba(255,255,255,0.15);color:white;}
.btn:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(139,92,246,0.35);}

/* ===== PREMIUM PANEL ===== */
.panel{width:360px;padding:22px;border-radius:20px;background:rgba(15,19,42,0.55);backdrop-filter:blur(20px);border:1px solid rgba(139,92,246,0.25);position:relative;overflow:hidden;animation:fadeUp 1.2s ease;transition:0.3s;}
.panel::before{content:"";position:absolute;inset:-2px;background:linear-gradient(120deg,#8b5cf6,#3b82f6,#8b5cf6);opacity:0.15;filter:blur(20px);}
.panel h3{font-family:'Orbitron';display:flex;justify-content:space-between;align-items:center;}
.panel h3::after{content:"LIVE";font-size:10px;padding:4px 8px;background:#22c55e;border-radius:20px;color:#000;}

/* TOGGLES */
.toggle{display:flex;justify-content:space-between;align-items:center;margin:12px 0;padding:12px;border-radius:14px;background:rgba(7,10,26,0.6);}
.toggle input{appearance:none;width:42px;height:22px;background:#1b1f3a;border-radius:50px;position:relative;cursor:pointer;transition:0.3s;}
.toggle input::before{content:"";width:18px;height:18px;background:white;position:absolute;top:2px;left:2px;border-radius:50%;transition:0.3s;}
.toggle input:checked{background:linear-gradient(135deg,#8b5cf6,#3b82f6);}
.toggle input:checked::before{transform:translateX(20px);}

/* STATS */
.stats{display:flex;justify-content:space-around;padding:70px 10%;text-align:center;}
.stat h2{font-family:'Orbitron';color:#8b5cf6;}
footer{text-align:center;padding:40px;color:#64748b;}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(25px);}to{opacity:1;transform:translateY(0);}}
@keyframes glow{0%{text-shadow:0 0 10px #8b5cf6;}50%{text-shadow:0 0 25px #3b82f6;}100%{text-shadow:0 0 10px #8b5cf6;}}
@keyframes float{0%{transform:translateY(0);}50%{transform:translateY(-10px);}100%{transform:translateY(0);}}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
    <div class="loader-box">
        <h2>SOFTDUMP</h2>
        <div class="bar"><div class="progress" id="progress"></div></div>
        <div class="text" id="loadText">Checking key...</div>
        <div class="percent" id="percent">0%</div>
    </div>
</div>

<!-- LOGIN -->
<div id="loginPage">
    <div class="box">
        <h1>SOFTDUMP</h1>
        <input id="key" placeholder="KEY">
        <button onclick="checkKey()">Войти</button>
        <div id="error"></div>
        <div id="success">ДОСТУП РАЗРЕШЕН</div>
    </div>
</div>

<!-- MAIN -->
<div id="mainSite">
<nav>
    <div class="logo">SOFT<span>DUMP</span></div>
</nav>

<section class="hero">
    <div class="hero-left">
        <div class="badge">Bypass / Safe Mode</div>
        <h1>SOFTDUMP <span>v1.0.8</span></h1>
        <div class="buttons">
            <a class="btn btn-primary" href="https://file.kiwi/7268f6b8#kJeD__8YOsvsXJX2EQQ20g" target="_blank">Скачать</a>
        </div>
    </div>

    <div class="panel">
        <h3>MENU</h3>
        <div class="toggle">Auto-Farm <input type="checkbox" checked></div>
        <div class="toggle">Teleport <input type="checkbox" checked></div>
        <div class="toggle">Silent Aim <input type="checkbox" checked></div>
        <div class="toggle">NoClip <input type="checkbox" checked></div>
    </div>
</section>

<section class="stats">
    <div class="stat"><h2>10K+</h2><p>Users</p></div>
    <div class="stat"><h2>9K+</h2><p>Downloads</p></div>
    <div class="stat"><h2>0%</h2><p>Ban</p></div>
    <div class="stat"><h2>24/7</h2><p>Online</p></div>
</section>

<footer>© 2026 SOFTDUMP</footer>
</div>

<script>
// ===== LOADER =====
window.addEventListener("load",()=>{
    let progress=0;
    const bar=document.getElementById("progress");
    const percent=document.getElementById("percent");
    const text=document.getElementById("loadText");
    const loader=document.getElementById("loader");
    const messages=["Checking key...","Loading modules...","Initializing UI...","Syncing data...","Ready..."];
    let msgIndex=0;
    let interval=setInterval(()=>{
        progress+=Math.floor(Math.random()*7)+2;
        if(progress>100) progress=100;
        bar.style.width=progress+"%";
        percent.innerText=progress+"%";
        if(progress>msgIndex*20&&msgIndex<messages.length){
            text.innerText=messages[msgIndex]; msgIndex++;
        }
        if(progress===100){
            clearInterval(interval);
            setTimeout(()=>{
                loader.style.opacity="0"; loader.style.transition="0.8s";
                setTimeout(()=>{loader.style.display="none";},800);
            },500);
        }
    },120);
});

// ===== KEYS =====
const keys=[];
for(let i=1;i<=100;i++) keys.push(`SOFTDUMP-${1000+i}-KEY`);
const masterKey="SOFTDUMP-ADMIN-UNLOCK";
const used=JSON.parse(localStorage.getItem("used")||"[]");

function checkKey(){
    let val=document.getElementById("key").value.trim().toUpperCase();
    let e=document.getElementById("error");
    let s=document.getElementById("success");
    e.style.display="none"; s.style.display="none";
    if(used.includes(val)){e.innerText="Уже использован"; e.style.display="block"; return;}
    if(keys.includes(val)||val===masterKey){
        if(val!==masterKey){used.push(val); localStorage.setItem("used",JSON.stringify(used));}
        s.style.display="block";
        setTimeout(()=>{document.getElementById("loginPage").style.display="none"; document.getElementById("mainSite").style.display="block";},500);
    } else {e.innerText="Неверный ключ"; e.style.display="block";}
}
</script>
</body>
</html>
